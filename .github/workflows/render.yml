name: Render Rakib Story

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q rakib-story-github-ready.zip -d project

      - name: Install dependencies
        run: cd project && npm install

      - name: Render video
        run: cd project && npx remotion render RakibStory out/rakib-story.mp4

      - name: Save MP4
        uses: actions/upload-artifact@v4
        with:
          name: rakib-story-mp4
          path: project/out/rakib-story.mp4
